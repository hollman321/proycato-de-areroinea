version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend

  db:
    image: postgres:15
    container_name: skyanalytics_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: skyanalytics
    ports:
      - "5432:5432"
